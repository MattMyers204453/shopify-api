spring.application.name=shopifyapi

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:shopifyapi}
spring.datasource.username=${PGUSER:DB_username}
spring.datasource.password=${PGPASSWORD:DB_password}

spring.jpa.hibernate.ddl-auto=update
